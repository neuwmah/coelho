default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: portfolio_api_development

test:
  <<: *default
  database: portfolio_api_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "portfolio_api_production" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV.fetch("POSTGRES_USER", "portfolio") } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { ENV["POSTGRES_PASSWORD"] } %>
